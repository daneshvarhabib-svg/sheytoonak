# Cloud build for a phone-only workflow: EditMode tests, then an installable Android APK.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  - contents of your Unity Personal .ulf licence file
#   UNITY_EMAIL    - your Unity account email
#   UNITY_PASSWORD - your Unity account password
# See docs/ANDROID_PHONE_WORKFLOW.md. Unity version comes from ProjectSettings/ProjectVersion.txt.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    name: Check Unity licence secrets
    runs-on: ubuntu-latest
    steps:
      - name: Fail early with a clear message if a secret is missing
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity licence missing::Add repository secrets:$missing (Settings > Secrets and variables > Actions). See docs/ANDROID_PHONE_WORKFLOW.md"
            exit 1
          fi
          echo "All three Unity secrets are present."

  tests:
    name: EditMode tests
    needs: licence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      # Pinned by commit. The floating v4 tag moved to v4.4.0 (2026-08-29), a rewrite that downloads
      # the game-ci CLI ("latest" unless pinned) at run time. v4.3.2 is the last classic release: it
      # runs Unity in the unityci image and writes artifacts/<testmode>-results.xml.
      - uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      # Unity treats "no tests found" as a passing run, so a broken test assembly would look green.
      - name: Fail if no Sheytoonak tests ran
        env:
          RESULTS: ${{ steps.tests.outputs.artifactsPath }}/editmode-results.xml
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          path = os.environ["RESULTS"]
          if not os.path.isfile(path):
              print(f"::error title=No test results::{path} was not written"); sys.exit(1)
          root = ET.parse(path).getroot()
          total = int(root.get("total", "0"))
          ours = [c for c in root.iter("test-case") if (c.get("fullname") or "").startswith("Sheytoonak.Tests.")]
          print(f"test-run total={total} passed={root.get('passed')} failed={root.get('failed')} sheytoonak={len(ours)}")
          if total == 0 or not ours:
              print("::error title=Zero tests::The EditMode run found no Sheytoonak tests. Check the test assembly definition and the Unity log.")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: ${{ steps.tests.outputs.artifactsPath }}

  android:
    name: Build Android APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic versioning counts commits
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: jlumbroso/free-disk-space@v1.3.1 # the Unity Android image is large
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2 (pinned, same as v4 on 2026-10-21)
        id: build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Sheytoonak
          buildMethod: Sheytoonak.EditorTools.SheytoonakBuild.BuildAndroidCI
      - uses: actions/upload-artifact@v4
        with:
          name: Sheytoonak-APK
          path: build/Android
          if-no-files-found: error
          retention-days: 14
